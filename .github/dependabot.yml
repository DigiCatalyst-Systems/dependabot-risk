version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # Dev tooling churns often and never reaches a consumer, so batch it into
      # one PR. dep-diff-mcp is a runtime dependency and stays individual: it is
      # the analysis engine, and its output is what this action publishes.
      dev-dependencies:
        dependency-type: "development"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
