version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      # dist/ is a committed bundle, and Dependabot cannot rebuild it -- every
      # npm pull request therefore fails the drift check until a maintainer
      # runs `npm run build` on the branch and commits the result. Grouping
      # makes that one rebuild per week rather than one per package.
      #
      # That manual step is the right shape for a bundled action: a runtime
      # dependency bump changes what executes on every consumer's runner, so
      # it deserves a look rather than an automatic merge.
      runtime:
        dependency-type: "production"
      dev-dependencies:
        dependency-type: "development"

  # Actions are pinned to commit SHAs with the tag in a trailing comment;
  # Dependabot updates both. No bundle is involved, so these merge on green.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
